<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halofold · 设计方向</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e8e4;color:#252829;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header{max-width:1150px;margin:40px auto 22px;padding:0 24px}h1{font-size:29px;letter-spacing:-1px;margin:10px 0}p{line-height:1.8;color:#747876}.eyebrow{font-size:11px;letter-spacing:3px;color:#828784}.controls{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:0}.controls button{padding:9px 14px;border-radius:20px;background:#dcded9;color:#5b655f}.controls button.on{background:#283b32;color:#fff}.boards{display:flex;gap:34px;justify-content:center;flex-wrap:wrap;padding:20px 20px 70px}.board{width:534px}.caption{display:flex;justify-content:space-between;align-items:center;padding:0 12px;margin-bottom:28px}.caption h2{font-size:17px;margin:0}.caption span{font-size:12px;color:#7a817a}.device{padding:12px;background:linear-gradient(145deg,#768d88,#abc0b2 60%,#96a5b1);border-radius:30px;box-shadow:0 18px 45px #293a3320;position:relative}.notch{height:20px;width:150px;background:#090b0d;border-radius:0 0 16px 16px;margin:-12px auto 0;position:relative;z-index:2}.panel{margin-top:-2px;width:510px;height:443px;background:#0d1013;border-radius:24px;color:#edf0f1;overflow:hidden;box-shadow:0 0 0 1px #ffffff15,0 16px 30px #0004;position:relative;transition:height .28s,opacity .2s}.panel.collapsed{height:46px}.nav{height:57px;display:flex;align-items:center;padding:0 18px;gap:4px;border-bottom:1px solid #ffffff08}.nav button{background:transparent;color:#828a90;font-size:12px;padding:8px 13px;border-radius:9px;transition:background .18s,color .18s}.nav button.active{color:#dce9e8;background:#ffffff0b}.nav .spacer{flex:1}.nav .icon{font-size:17px;padding:7px}.view{height:386px;padding:17px 20px;overflow:auto;animation:enter .22s ease-out}.view::-webkit-scrollbar{width:4px}.view::-webkit-scrollbar-thumb{background:#ffffff22;border-radius:4px}@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}button:hover{filter:brightness(1.18)}button:active{transform:translateY(1px)}button:focus-visible,textarea:focus-visible{outline:2px solid #9edbd0;outline-offset:3px}.label{font-size:11px;color:#8b959e;letter-spacing:.4px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.dot{width:6px;height:6px;border-radius:50%;background:#8ecbb0;flex:none}.muted{color:#87919b;font-size:12px}.small{font-size:11px;color:#67727c}.title{font-size:14px;font-weight:550;line-height:1.6}.action{background:#b8d9ca;color:#1a3228;padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600}.ghost{background:#ffffff09;color:#b9c2c9;padding:7px 12px;border:1px solid #ffffff0c;border-radius:8px;font-size:12px}.task{padding:12px 0;border-bottom:1px solid #ffffff09}.task .title{font-size:13px}.task .muted{margin-left:auto;white-space:nowrap}.sectionlabel{margin:19px 0 2px;font-size:11px;color:#7e8a93}.attention{padding:13px 15px;background:linear-gradient(110deg,#b8d9ca12,#b8d9ca04);border-left:2px solid #b8d9ca;border-radius:3px 12px 12px 3px}.attention .title{margin:5px 0 9px}.focusstrip{margin-top:14px;padding:10px 12px;border:1px solid #ffffff0d;background:#ffffff04;border-radius:10px;cursor:pointer}.time{font-variant-numeric:tabular-nums;letter-spacing:-1px;font-size:22px;font-weight:500}.footerline{margin-top:15px;display:flex;justify-content:space-between;font-size:11px;color:#63717a}.b .panel{background:linear-gradient(155deg,#17191d,#0b0d10 75%)}.b .nav button.active{background:linear-gradient(#ffffff13,#ffffff06);box-shadow:inset 0 1px #ffffff17;color:#f0f0f0}.b .view{padding:14px 16px}.card{border:1px solid #ffffff09;border-radius:17px;padding:15px;background:linear-gradient(145deg,#ffffff08,#ffffff02);box-shadow:inset 0 1px #ffffff06}.b .attention{border-left:1px solid #ffffff09;background:linear-gradient(130deg,#bddbca15,#ffffff02);border-radius:17px}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;margin-top:10px}.timer{cursor:pointer;position:relative;overflow:hidden}.timer:after{content:'';position:absolute;left:22px;right:22px;top:0;height:1px;background:linear-gradient(90deg,transparent,#bedfc2aa,transparent)}.timer .time{font-size:34px;margin:7px 0}.timer small{color:#aec7b7;font-size:11px}.count{font-size:29px;margin:8px 0;color:#dde2e7;font-weight:500}.b .task{padding:10px 0}.chips{display:flex;gap:7px;overflow:auto;margin-bottom:16px}.chips button{background:transparent;border-radius:7px;color:#7b8790;padding:7px 10px;white-space:nowrap;font-size:12px}.chips button.selected{background:#ffffff0b;color:#d4dfe5}.note-title{font-size:21px;font-weight:600;letter-spacing:-.4px;margin:12px 0 15px}.note{resize:none;border:0;width:100%;height:210px;line-height:1.9;background:transparent;color:#b9c2c9;font:14px/1.9 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;outline:none}.tools{display:flex;align-items:center;gap:5px;border-top:1px solid #ffffff0a;padding-top:11px}.tools button{background:transparent;color:#a0aab2;min-width:27px;height:28px;border-radius:6px}.tools button:hover{background:#ffffff0b}.tools .small{margin-left:auto}.days{display:flex;justify-content:space-between;margin:14px 0}.days button{padding:7px 12px;background:transparent;color:#858e96;border-radius:10px;font-size:12px}.days button.selected{background:#c9dac612;color:#d1e4ca;box-shadow:inset 0 0 0 1px #c9dac625}.days b{display:block;margin-top:4px;font-size:16px}.focusbig{text-align:center;padding:0 8px}.focusbig .bigtime{font-size:76px;letter-spacing:-4px;font-weight:400;font-variant-numeric:tabular-nums;margin:20px 0}.ring{height:140px;width:140px;margin:6px auto 10px;border-radius:50%;border:2px solid #ffffff0b;border-top-color:#b9d8c0;border-right-color:#b9d8c0;display:flex;align-items:center;justify-content:center;box-shadow:0 -8px 30px #a8d3b406}.ring .bigtime{font-size:42px;letter-spacing:-2px}.toast{position:absolute;bottom:15px;left:20px;right:20px;padding:12px;background:#26352e;border:1px solid #bcd5c633;border-radius:10px;font-size:12px;display:flex;justify-content:space-between;z-index:4;box-shadow:0 5px 20px #0007}.description{padding:17px 12px;font-size:13px;color:#6d766f;line-height:1.9}.warning{color:#e7bc87}.pulse{animation:light .7s ease-out}@keyframes light{0%{box-shadow:0 0 0 1px #cce4cc88,0 0 22px #cce4cc22}100%{box-shadow:0 0 0 1px #ffffff15,0 16px 30px #0004}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:570px){.board{width:100%;overflow:auto}.device{width:534px}.boards{justify-content:flex-start}header{margin-top:25px}}
</style><header><div class="eyebrow">HALOFOLD · DESIGN STUDY 01</div><h1>两种方向，同一份工作内容。</h1><p>先感受布局、层次和操作反馈。两版面板均为 510 × 443，可点击导航、专注卡片与完成按钮，便签可编辑。<br>这是设计原型，操作仅影响页面内的示例数据。</p><div class="controls"><button class="on" data-scene="normal">日常状态</button><button data-scene="busy">多任务 / 长标题</button><button data-scene="error">连接异常</button><button data-scene="empty">空状态</button><button id="replay">重播展开</button><button id="reset">重置演示</button></div></header><main class="boards"></main><script>
let scene='normal';const states=[{tab:'活动',done:false,note:'本周想解决的三个体验问题\n\n1. 让需要处理的事情更容易看见\n2. 记录灵感时，不打断正在进行的工作\n3. 让每次提醒都有一个清楚的下一步',noteTab:'产品想法',minute:24,second:35},{tab:'活动',done:false,note:'本周想解决的三个体验问题\n\n1. 让需要处理的事情更容易看见\n2. 记录灵感时，不打断正在进行的工作\n3. 让每次提醒都有一个清楚的下一步',noteTab:'产品想法',minute:24,second:35}];
const board=document.querySelector('.boards');board.innerHTML=states.map((_,i)=>`<article class="board ${i?'b':'a'}"><div class="caption"><h2>${i?'B / 局部便当盒':'A / 精致紧凑'}</h2><span>${i?'分区 · 主次 · 柔和光感':'连贯 · 轻量 · 内容优先'}</span></div><div class="device"><div class="notch"></div><div class="panel" id="p${i}"></div></div><div class="description">${i?'让当前专注、下一项安排拥有独立区域。用微弱表面高光区分层次，正文编辑保持完整空间。':'用留白与细分隔建立秩序。弱化容器，维持连续阅读；操作与状态反馈尽量贴近内容。'}</div></article>`).join('');
function time(s){return `${String(s.minute).padStart(2,'0')}:${String(s.second).padStart(2,'0')}`}
function notify(i,text,undo){const p=document.querySelector('#p'+i);p.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.append(document.createTextNode(text));if(undo){const b=document.createElement('button');b.className='ghost';b.textContent='撤销';b.onclick=()=>{undo();render(i)};el.append(b)}p.append(el);setTimeout(()=>el.remove(),5000)}
function nav(i){const s=states[i];return `<nav class="nav">${['活动','便签','日程'].map(t=>`<button data-tab="${t}" class="${s.tab===t?'active':''}">${t}</button>`).join('')}<span class="spacer"></span><button class="icon" data-act="settings" aria-label="设置">⚙</button><button class="icon" data-act="collapse" aria-label="收起或展开">⌃</button></nav>`}
function attention(i){const s=states[i];if(s.done)return `<div class="attention"><div class="label">✓ 已处理</div><div class="title">发布前确认已完成</div><span class="muted">现在可以继续手上的工作</span></div>`;return `<div class="attention"><div class="label">● 需要你处理 · ${scene==='busy'?4:1} 项</div><div class="title">${scene==='busy'?'新版本发布前的账号与权限确认，需要你继续处理':'发布前账号确认'}</div><div class="row between"><span class="muted">等待你确认发布信息</span><button class="action" data-act="task">查看任务 ↗</button></div></div>`}
function timer(i,card=false){if(states[i].focusCompleted)return `<div class="${card?'card timer':'focusstrip'}"><div class="label">✓ 本次专注已完成</div><div class="title" style="margin-top:8px">整理本周产品反馈</div><div class="muted">给自己一点休息时间</div></div>`;return `<div class="${card?'card timer':'focusstrip row between'}" data-act="focus" role="button" tabindex="0"><div><div class="label">当前专注 · 产品设计</div><div class="${card?'time':'muted'}" ${card?'data-clock="'+i+'"':''}>${card?time(states[i]):'整理本周产品反馈'}</div>${card?'<small>查看专注详情 ↗</small>':''}</div>${card?'':`<span class="time" data-clock="${i}">${time(states[i])}</span>`}</div>`}
function tasks(){const a=scene==='busy'?['为多语言营销页面补充完整的发布验收与回归记录','整理本周产品体验反馈','检查设置页布局','整理测试记录','更新文档']:['优化数据导入性能','检查设置页布局'];return a.map((t,n)=>`<div class="row task"><span class="dot"></span><span class="title">${t}</span><span class="muted">${n?21:3} 分钟</span></div>`).join('')}
function activity(i){if(scene==='empty')return `<div style="padding:52px 20px;text-align:center"><div style="font-size:30px;color:#b3cbbd">✓</div><h3>现在没有需要跟进的事</h3><p class="muted">任务状态会在这里更新。<br>可以先记下想法，或安排下一段专注。</p><button class="action" data-tab="便签">记下想法</button> <button class="ghost" data-tab="日程">安排日程</button></div>`;return attention(i)+(i?`<div class="grid">${timer(i,true)}<div class="card"><div class="label">下一项安排</div><div class="count">15:00</div><div class="title">阅读与学习</div><div class="small" style="margin-top:6px">30 分钟 · 今天</div></div></div><div class="sectionlabel">运行中 · ${scene==='busy'?8:2}</div>${tasks()}<div class="row task between"><span class="muted">✓ 已完成 2 项</span><button class="ghost" data-act="history">查看记录</button></div>`:timer(i)+`<div class="row between" style="margin-top:12px"><span class="label">下一项 · 15:00</span><span class="muted">阅读与学习 · 30 分钟</span></div>`+`<div class="sectionlabel">运行中 · ${scene==='busy'?8:2}</div>${tasks()}<div class="row task between"><span class="muted">✓ 已完成 2 项</span><button class="ghost" data-act="history">查看记录</button></div>`)+`<div class="footerline ${scene==='error'?'warning':''}">${scene==='error'?'<span>连接中断 · 当前为上次同步内容</span><button class="ghost" data-act="retry">重新连接</button>':'<span>刚刚同步</span><span>本周剩余 64%</span>'}</div>`}
function notes(i){return `<div class="chips">${['产品想法','本周待办','设计参考'].map(t=>`<button data-note="${t}" class="${states[i].noteTab===t?'selected':''}">${t}</button>`).join('')}<button data-act="new">＋ 新建</button></div><div class="note-title">${states[i].noteTab}</div><textarea class="note" aria-label="便签内容"></textarea><div class="tools">${['H','B','❞','☷','☑'].map(t=>`<button data-format="${t}" aria-label="格式 ${t}">${t}</button>`).join('')}<span class="small" data-save>已自动保存</span><button data-act="delete" aria-label="删除便签">⌫</button></div>`}
function schedule(i){return `<div class="row between"><span class="label">9 月 14 日 · 星期一</span><button class="ghost" data-act="add">＋ 新日程</button></div><div class="days">${['一','二','三','四','五','六','日'].map((d,n)=>`<button data-day="${n}" class="${n===0?'selected':''}">${d}<b>${14+n}</b></button>`).join('')}</div>${i?`<div class="grid">${timer(i,true)}<div class="card"><div class="label">今天的节奏</div><div class="count">2 <small style="font-size:12px;color:#88968e">项安排</small></div><div class="muted">留一点时间给自己</div></div></div>`:timer(i)}<div class="sectionlabel">接下来</div><div class="row task"><span class="muted">15:00</span><div><div class="title">阅读与学习</div><div class="small">30 分钟 · 每周重复</div></div><button class="ghost" style="margin-left:auto" data-act="edit">编辑</button></div><div class="row task"><span class="muted">16:00</span><div><div class="title">回顾今天的工作</div><div class="small">20 分钟</div></div></div>`}
function focus(i){return `<div class="focusbig"><button class="ghost" data-tab="日程">← 返回日程</button><div class="label" style="margin-top:8px">正在专注</div><div class="title" style="margin-top:8px">整理本周产品反馈</div>${i?`<div class="ring"><div class="bigtime" data-clock="${i}">${time(states[i])}</div></div>`:`<div class="bigtime" data-clock="${i}">${time(states[i])}</div><div class="muted" style="margin-bottom:16px">给这一件事，留一段完整的时间。</div>`}<button class="action" data-act="complete">✓ 完成专注</button> <button class="ghost" data-act="extend">＋ 10 分钟</button></div>`}
function render(i){const s=states[i],p=document.querySelector('#p'+i);p.innerHTML=nav(i)+`<div class="view">${s.tab==='便签'?notes(i):s.tab==='日程'?schedule(i):s.tab==='focus'?focus(i):activity(i)}</div>`;const ta=p.querySelector('textarea');if(ta){ta.value=s.note;ta.oninput=()=>{s.note=ta.value;p.querySelector('[data-save]').textContent='已自动保存'}}p.onclick=e=>{const b=e.target.closest('[data-tab],[data-act],[data-note],[data-day],[data-format]');if(!b)return;if(b.dataset.tab){s.tab=b.dataset.tab;render(i)}else if(b.dataset.note){s.noteTab=b.dataset.note;render(i)}else if(b.dataset.day){p.querySelectorAll('[data-day]').forEach(x=>x.classList.toggle('selected',x===b));notify(i,`已选择 9 月 ${14+Number(b.dataset.day)} 日 · 示例安排`)}else if(b.dataset.format){notify(i,'格式工具位置示意；此稿重点评估布局与反馈')}else{switch(b.dataset.act){case'collapse':p.classList.toggle('collapsed');break;case'focus':s.tab='focus';render(i);break;case'complete':s.tab='活动';s.focusCompleted=true;render(i);p.classList.add('pulse');notify(i,'专注已完成 · 本次投入已记录');break;case'extend':s.minute+=10;render(i);notify(i,'已延长 10 分钟');break;case'task':s.done=true;render(i);notify(i,'演示：确认完成，回到当前工作');break;case'retry':notify(i,'演示：连接已恢复');break;case'new':s.noteTab='新想法';s.note='';s.tab='便签';render(i);p.querySelector('textarea').focus();break;case'delete':const previous=s.note;s.note='';render(i);notify(i,'便签内容已删除',()=>s.note=previous);break;case'add':case'edit':notify(i,'日期、时长和重复规则将在编辑层内呈现');break;case'settings':notify(i,'设置入口：位置固定，详细设置沿用现有分组');break;case'history':notify(i,'今天已完成：布局检查、交互回归');break}}};p.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act="focus"]')){e.preventDefault();s.tab='focus';render(i)}}}
states.forEach((_,i)=>render(i));document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;document.querySelectorAll('[data-scene]').forEach(x=>x.classList.toggle('on',x===b));states.forEach((s,i)=>{s.tab='活动';s.done=false;s.focusCompleted=false;render(i)})});document.querySelector('#replay').onclick=()=>{document.querySelectorAll('.panel').forEach(p=>p.classList.add('collapsed'));setTimeout(()=>document.querySelectorAll('.panel').forEach(p=>p.classList.remove('collapsed')),420)};document.querySelector('#reset').onclick=()=>location.reload();setInterval(()=>{if(document.hidden)return;states.forEach((s,i)=>{if(s.focusCompleted)return;if(s.second===0){if(s.minute>0){s.minute--;s.second=59}}else s.second--;document.querySelectorAll(`[data-clock="${i}"]`).forEach(e=>e.textContent=time(s))})},1000);
</script></html>
