name: CodexIsland
options:
  bundleIdPrefix: com.tinyray
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  CodexIsland:
    type: application
    platform: macOS
    sources:
      - path: Sources/CodexIsland
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Localizable.xcstrings
      - path: Resources/InfoPlist.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinyray.halofold
        PRODUCT_NAME: Halofold
        PRODUCT_MODULE_NAME: CodexIsland
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/CodexIsland.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 9
        MARKETING_VERSION: 1.1.0
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Sources/CSQLite"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_LANGUAGE: zh-Hans
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    scheme:
      testTargets:
        - CodexIslandTests
  CodexIslandTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CodexIslandTests
    dependencies:
      - target: CodexIsland
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tinyray.halofold.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Halofold.app/Contents/MacOS/Halofold"
        BUNDLE_LOADER: "$(TEST_HOST)"
