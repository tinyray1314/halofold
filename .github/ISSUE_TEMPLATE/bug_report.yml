name: Bug report
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请先移除截图和日志中的个人信息、对话内容与凭据。
  - type: input
    id: version
    attributes:
      label: Halofold 版本
      placeholder: 例如 1.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统环境
      placeholder: 例如 macOS 15.6，Apple M2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始，列出最小步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除密码、令牌、验证码、真实对话和其他个人信息。
          required: true
