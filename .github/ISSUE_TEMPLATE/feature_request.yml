name: Feature request
description: 提议一个能改善实际使用体验的功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 请先描述场景和阻碍，而不是只列功能名称。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的体验
      description: 说明理想流程，以及为什么它适合屏幕顶部的低打扰入口。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代方式
      description: 可选。你现在如何处理这个问题？
